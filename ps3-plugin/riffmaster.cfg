# Copy to /dev_hdd0/plugins/riffmaster.cfg (optional).
# profile=auto  -> Rock Band titles get the RB guitar ID, everything else GH (default)
# profile=gh    -> always report a Guitar Hero guitar (0x12BA:0x0100)
# profile=rb    -> always report a Rock Band guitar  (0x12BA:0x0200)
# Only profile=gh has been tested (GH Metallica, Greatest Hits, Warriors of Rock).
# auto and rb are untested; if a Guitar Hero game doesn't react, try profile=gh.
profile=auto

# Tilt (star power / overdrive). The Riffmaster reads ~0x1D level to ~0xF2 neck straight up.
# Tilt turns on at tilt_on or above and off again at tilt_off or below. If star power
# goes off while you're just playing, raise tilt_on; if tilts don't register, lower it.
# tilt_on=0x100 turns tilt off completely (Select still deploys star power).
tilt_on=0xA0
tilt_off=0x70
# Motion sensor X value sent to the game when level / tilted (0-0x3FF, default 0x200 / 0x180).
# Only for experimenting: commented out, the profile's values are used.
sensor_level=0x200
#sensor_tilted=0x180

# XMB notifications (every message is written to the log either way):
# notifications=2 -> show all: loader loaded, game found, plugin loaded, guitar connected, and failures (default)
# notifications=1 -> show only failures
# notifications=0 -> show none
notifications=2

# Debugging a freeze: each debug_stage adds one step of the loader's work.
# debug_stage=0 -> loader only logs (no VSH or PS3MAPI calls, no notifications)
# debug_stage=1 -> + notifications and game detection, but doesn't inject
# debug_stage=2 -> + injects the game plugin (normal, the default)
# trace=1       -> log before and after every call the loader's poll makes
debug_stage=2
trace=0
