# Copy to /dev_hdd0/plugins/riffmaster.cfg (optional).
# profile=auto  -> Rock Band titles get the RB guitar ID, everything else GH
# profile=gh    -> always report a Guitar Hero guitar (0x12BA:0x0100)
# profile=rb    -> always report a Rock Band guitar  (0x12BA:0x0200)
profile=auto

# Debugging a freeze: each debug_stage adds one step of the loader's work.
# debug_stage=0 -> loader only logs (no PS3MAPI calls, no notifications)
# debug_stage=1 -> + notifications, polls the process ID list
# debug_stage=2 -> + reads new processes' names to detect the game, but doesn't inject
# debug_stage=3 -> + injects the game plugin (normal, the default)
# trace=1       -> log before and after every PS3MAPI call the loader makes
debug_stage=3
trace=0
